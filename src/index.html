<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTech Academy - Alunos</title>
</head>
<body>
    <h1>DevTech Academy - Gerenciamento de Alunos</h1>

    <h2 id="tituloFormulario">Cadastrar Aluno</h2>
    <form id="formAluno">
        <p>
            <label for="nome">Nome:</label>
            <input type="text" id="nome">
        </p>
        <p>
            <label for="idade">Idade:</label>
            <input type="number" id="idade" min="1" max="120">
        </p>
        <p>
            <label for="curso">Curso:</label>
            <select id="curso">
                <option value="">Selecione</option>
                <option value="JavaScript">JavaScript</option>
                <option value="Python">Python</option>
                <option value="Java">Java</option>
            </select>
        </p>
        <p>
            <label for="notaFinal">Nota Final:</label>
            <input type="number" id="notaFinal" min="0" max="10" step="0.1">
        </p>
        <p>
            <button type="button" id="btnSalvar" onclick="salvarAluno()">Cadastrar</button>
        </p>
    </form>

    <h2>Alunos Cadastrados</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Curso</th>
                <th>Nota Final</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaAlunos"></tbody>
    </table>

    <script src="js/app.js"></script>
</body>
</html>
